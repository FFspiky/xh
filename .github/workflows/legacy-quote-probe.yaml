name: Legacy quote probe
on:
  push:
    branches: [validate/legacy-quote-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/validation/probe_legacy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-quote-probe
          path: legacy-quote-probe-evidence/
          retention-days: 14
